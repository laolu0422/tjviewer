name: release

# 推送 v* 标签时自动构建并发布：
#   server 任务（ubuntu）：tjviewer-server-linux-x64.tar.gz / tjviewer-server-win-x64.zip
#   client 任务（windows）：tjviewer-client-win-x64.zip（含 ffmpeg）
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Check install script syntax
        run: bash -n scripts/install-server.sh

      - name: Publish server (self-contained linux-x64)
        run: |
          dotnet publish src/TjViewer.Server -c Release -r linux-x64 --self-contained true -o out/server

      - name: Publish server (self-contained win-x64)
        run: |
          dotnet publish src/TjViewer.Server -c Release -r win-x64 --self-contained true -o out/server-win

      - name: Package servers
        run: |
          cp LICENSE THIRD-PARTY-NOTICES.txt out/server/
          tar -czf tjviewer-server-linux-x64.tar.gz -C out/server .
          cp LICENSE THIRD-PARTY-NOTICES.txt scripts/start-server.cmd out/server-win/
          (cd out/server-win && zip -qr ../../tjviewer-server-win-x64.zip .)
          ls -lh tjviewer-server-*.tar.gz tjviewer-server-*.zip

      - name: Publish server release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            tjviewer-server-linux-x64.tar.gz
            tjviewer-server-win-x64.zip

  client:
    needs: server
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish client (self-contained win-x64)
        shell: pwsh
        run: |
          dotnet publish src/TjViewer.Client -c Release -r win-x64 --self-contained true -o out/client
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Bundle ffmpeg and package
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-dist
          $ff = Get-ChildItem ffmpeg-dist -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $ff) { throw "ffmpeg.exe not found" }
          Copy-Item $ff.FullName out/client/ffmpeg.exe
          $lic = Join-Path (Split-Path (Split-Path $ff.FullName -Parent) -Parent) 'LICENSE.txt'
          if (Test-Path $lic) { Copy-Item $lic out/client/ffmpeg-LICENSE.txt }
          Copy-Item LICENSE out/client/
          Copy-Item THIRD-PARTY-NOTICES.txt out/client/
          Compress-Archive -Path out/client/* -DestinationPath tjviewer-client-win-x64.zip -CompressionLevel Optimal
          Get-Item tjviewer-client-win-x64.zip | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Publish client release asset
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: tjviewer-client-win-x64.zip
