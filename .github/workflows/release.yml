name: release

# 推送 v* 标签时自动构建自包含服务端（Linux/Windows）与客户端包并发布 Release。
# 产物：tjviewer-server-linux-x64.tar.gz / tjviewer-server-win-x64.zip / tjviewer-client-win-x64.zip

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Check install script syntax
        run: bash -n scripts/install-server.sh

      - name: Publish server (self-contained linux-x64)
        run: |
          dotnet publish src/TjViewer.Server -c Release -r linux-x64 --self-contained true -o out/server

      - name: Publish server (self-contained win-x64)
        run: |
          dotnet publish src/TjViewer.Server -c Release -r win-x64 --self-contained true -o out/server-win

      - name: Publish client (self-contained win-x64)
        run: |
          dotnet publish src/TjViewer.Client -c Release -r win-x64 --self-contained true -o out/client

      - name: Bundle ffmpeg for client
        run: |
          curl -fL --retry 3 -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          unzip -q ffmpeg.zip -d ffmpeg-dist
          FF=$(find ffmpeg-dist -path '*/bin/ffmpeg.exe' | head -1)
          test -n "$FF"
          cp "$FF" out/client/ffmpeg.exe
          FF_ROOT=$(dirname "$(dirname "$FF")")
          if [ -f "$FF_ROOT/LICENSE.txt" ]; then cp "$FF_ROOT/LICENSE.txt" out/client/ffmpeg-LICENSE.txt; fi
          cp LICENSE THIRD-PARTY-NOTICES.txt out/client/
          (cd out/client && zip -qr ../../tjviewer-client-win-x64.zip .)
          ls -lh tjviewer-client-win-x64.zip

      - name: Package
        run: |
          cp LICENSE THIRD-PARTY-NOTICES.txt out/server/
          tar -czf tjviewer-server-linux-x64.tar.gz -C out/server .
          cp LICENSE THIRD-PARTY-NOTICES.txt scripts/start-server.cmd out/server-win/
          (cd out/server-win && zip -qr ../../tjviewer-server-win-x64.zip .)
          ls -lh tjviewer-server-*.tar.gz tjviewer-server-*.zip tjviewer-client-*.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            tjviewer-server-linux-x64.tar.gz
            tjviewer-server-win-x64.zip
            tjviewer-client-win-x64.zip
