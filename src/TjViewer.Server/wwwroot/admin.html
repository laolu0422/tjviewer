<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>TjViewer 管理后台</title>
<style>
  body{font-family:system-ui,"Segoe UI",sans-serif;margin:0;background:#f5f6f8;color:#222}
  header{background:#1f2937;color:#fff;padding:12px 20px;font-size:18px}
  .wrap{max-width:1000px;margin:20px auto;padding:0 16px}
  .card{background:#fff;border-radius:8px;padding:16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  input,button,select{padding:6px 10px;font-size:14px;border:1px solid #ccc;border-radius:4px}
  button{cursor:pointer;background:#2563eb;color:#fff;border:none}
  button.gray{background:#6b7280} button.red{background:#dc2626} button.green{background:#16a34a}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid #eee}
  .tabs button{background:#e5e7eb;color:#222;margin-right:6px}
  .tabs button.active{background:#2563eb;color:#fff}
  .muted{color:#888;font-size:13px}
  #login{max-width:360px;margin:60px auto}
  .row{display:flex;gap:8px;align-items:center;margin:6px 0}
  .hide{display:none}
</style>
</head>
<body>
<header>TjViewer 管理后台</header>

<div id="login" class="card">
  <h3>管理员登录</h3>
  <div class="row"><input id="lu" placeholder="用户名" style="flex:1"/></div>
  <div class="row"><input id="lp" type="password" placeholder="密码" style="flex:1"/></div>
  <div class="row"><button onclick="login()" style="flex:1">登录</button></div>
  <div class="muted" id="lmsg"></div>
</div>

<div id="app" class="wrap hide">
  <div class="card tabs">
    <button data-t="users" class="active" onclick="tab('users')">用户</button>
    <button data-t="devices" onclick="tab('devices')">设备</button>
    <button data-t="sessions" onclick="tab('sessions')">会话</button>
    <button data-t="audit" onclick="tab('audit')">审计</button>
    <button data-t="config" onclick="tab('config')">配置</button>
    <button class="gray" style="float:right" onclick="logout()">退出</button>
  </div>
  <div class="card" id="panel"></div>
</div>

<script>
let TOKEN=null; // 仅存内存，降低 XSS 持久化风险
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(method,path,body){
  const r=await fetch(path,{method,headers:{"Content-Type":"application/json","Authorization":"Bearer "+TOKEN},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error||("请求失败 "+r.status));
  return j;
}
async function login(){
  try{
    const r=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({account:lu.value,password:lp.value})});
    const j=await r.json();
    if(!r.ok) throw new Error(j.error||"登录失败");
    TOKEN=j.token;
    // 校验管理员角色：尝试访问管理接口
    await api("GET","/api/admin/users");
    document.getElementById("login").classList.add("hide");
    document.getElementById("app").classList.remove("hide");
    tab("users");
  }catch(e){ lmsg.textContent=e.message+"（需管理员账号）"; }
}
function logout(){ TOKEN=null; location.reload(); }
function tab(t){
  document.querySelectorAll(".tabs button[data-t]").forEach(b=>b.classList.toggle("active",b.dataset.t===t));
  ({users:renderUsers,devices:renderDevices,sessions:renderSessions,audit:renderAudit,config:renderConfig}[t])();
}
async function renderUsers(){
  const us=await api("GET","/api/admin/users");
  let h="<h3>用户账号</h3><table><tr><th>用户名</th><th>邮箱</th><th>状态</th><th>管理员</th><th>设备数</th><th>操作</th></tr>";
  for(const u of us){
    h+=`<tr><td>${esc(u.username)}</td><td>${esc(u.email)}</td><td>${esc(u.status)}</td><td>${u.isAdmin?"是":"否"}</td><td>${u.deviceCount}</td>
    <td>
      <button class="${u.status==='Disabled'?'green':'gray'}" onclick="setStatus('${u.id}',${u.status!=='Disabled'})">${u.status==='Disabled'?'启用':'禁用'}</button>
      <button class="gray" onclick="resetPw('${u.id}')">重置密码</button>
      <button class="red" onclick="delUser('${u.id}','${esc(u.username)}')">删除</button>
    </td></tr>`;
  }
  panel.innerHTML=h+"</table>";
}
async function setStatus(id,disabled){ await api("POST",`/api/admin/users/${id}/status`,{disabled}); renderUsers(); }
async function delUser(id,name){ if(confirm(`确认删除用户「${name}」及其设备？此操作不可逆。`)){ await api("DELETE",`/api/admin/users/${id}`); renderUsers(); } }
async function resetPw(id){ const j=await api("POST",`/api/admin/users/${id}/reset-password`); alert(j.sentEmail?"重置邮件已发送":("重置令牌（转交用户）："+j.resetToken)); }
async function renderDevices(){
  const ds=await api("GET","/api/admin/devices");
  let h="<h3>设备</h3><table><tr><th>名称</th><th>归属</th><th>状态</th><th>最后在线</th><th>系统</th></tr>";
  for(const d of ds) h+=`<tr><td>${esc(d.name)}</td><td>${esc(d.ownerId)}</td><td>${esc(d.status)}</td><td>${esc(d.lastSeen)}</td><td>${esc(d.osSummary)}</td></tr>`;
  panel.innerHTML=h+"</table>";
}
async function renderSessions(){
  const ss=await api("GET","/api/admin/sessions");
  let h="<h3>会话（最近 200）</h3><table><tr><th>会话</th><th>控制端</th><th>被控端</th><th>状态</th><th>创建</th></tr>";
  for(const s of ss) h+=`<tr><td>${esc(s.id)}</td><td>${esc(s.controllerDeviceId)}</td><td>${esc(s.hostDeviceId)}</td><td>${esc(s.state)}</td><td>${esc(s.createdAt)}</td></tr>`;
  panel.innerHTML=h+"</table>";
}
async function renderAudit(){
  const as=await api("GET","/api/admin/audit");
  let h="<h3>审计日志（最近 200）</h3><table><tr><th>时间</th><th>操作者</th><th>动作</th><th>目标</th><th>结果</th></tr>";
  for(const a of as) h+=`<tr><td>${esc(a.createdAt)}</td><td>${esc(a.actorId)}</td><td>${esc(a.action)}</td><td>${esc(a.target)}</td><td>${esc(a.result)}</td></tr>`;
  panel.innerHTML=h+"</table>";
}
async function renderConfig(){
  const c=await api("GET","/api/admin/config");
  let h="<h3>系统配置</h3><p class='muted'>SMTP 与限额等（键值）。保存后生效。</p>";
  h+="<div id='cfgrows'>";
  const keys=Object.keys(c);
  for(const k of keys) h+=`<div class='row'><input value="${esc(k)}" data-k style='width:200px'/><input value="${esc(c[k])}" data-v style='flex:1'/></div>`;
  h+="</div><div class='row'><button class='gray' onclick='addCfg()'>新增项</button><button onclick='saveCfg()'>保存</button></div>";
  panel.innerHTML=h;
}
function addCfg(){ const d=document.createElement("div"); d.className="row"; d.innerHTML="<input data-k placeholder='键' style='width:200px'/><input data-v placeholder='值' style='flex:1'/>"; document.getElementById("cfgrows").appendChild(d); }
async function saveCfg(){
  const rows=document.querySelectorAll("#cfgrows .row"); const values={};
  rows.forEach(r=>{ const k=r.querySelector("[data-k]").value.trim(); if(k) values[k]=r.querySelector("[data-v]").value; });
  await api("PUT","/api/admin/config",{values}); alert("已保存"); renderConfig();
}
</script>
</body>
</html>
